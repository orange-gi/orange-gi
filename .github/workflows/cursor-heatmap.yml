name: Update Cursor heatmap

on:
  schedule:
    - cron: '23 1 * * *' # 09:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cursor-heatmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read public Cursor profile and render heatmap
        run: python scripts/update_cursor_heatmap.py
      - name: Commit updated activity
        run: |
          git add assets/cursor-activity.json assets/cursor-heatmap.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Cursor activity heatmap'
          git pull --rebase origin main
          git push origin HEAD:main
